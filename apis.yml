apis:
- name: The Giving Block Public API
  description: >-
    RESTful JSON API for accepting crypto, stock, and card donations on behalf of
    nonprofits in The Giving Block network. Provides organization management, currency
    and exchange-rate lookups, crypto deposit-address creation, stock donation pledge
    and signing flows, fiat/card pledge and charge operations, transaction retrieval,
    and embeddable widget snippet/URL generation. Uses JWT authentication (login +
    refresh-token endpoints) and AES-256 encrypted webhook notifications.
