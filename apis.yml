aid: the-giving-block
name: The Giving Block
description: >-
  The Giving Block is a crypto-native fundraising platform that lets nonprofits and
  enterprises accept cryptocurrency, stock, and card donations. Through its Public API
  and embeddable donation widget, partners can build their own donation experiences or
  embed The Giving Block's donation form to route gifts to more than 1,000 nonprofit
  organizations in its network. The API securely accepts Bitcoin, Ethereum, and 100+
  other cryptocurrencies, instantly converts crypto donations to cash so nonprofits
  never have to touch crypto, and also supports stock and donor-advised-fund (DAF)
  giving. It is a RESTful, JSON API with JWT-based authentication, AES-256 encrypted
  webhook notifications, and separate production and sandbox environments. The Giving
  Block was surfaced as a portfolio company of Multicoin Capital and enriched into the
  API Evangelist network from its published developer documentation.
