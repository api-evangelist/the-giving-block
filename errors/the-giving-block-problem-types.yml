envelope:
  fields:
  - name: errorMessage
    description: Human-readable description of the error.
  - name: errorType
    description: Machine-readable error category for programmatic handling.
  - name: errorCode
    description: Optional numeric/string code for specific error conditions.
  - name: meta
    description: Additional context object accompanying the error.
  - name: requestId
    description: Correlation id echoed on every response for support/tracing.
notes:
- Errors are NOT RFC 9457 (application/problem+json); they use a proprietary JSON envelope.
- errorType and errorCode are the fields intended for programmatic branching.
